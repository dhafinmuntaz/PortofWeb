<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Portfolio</title>
    <meta name="description" content="Kinetic and spatial portfolio for architectural design, minimalist residential sanctuaries, and brutalist interior architecture.">
    <link rel="preconnect" href="https://api.fontshare.com">
    <link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700,900&f[]=general-sans@400,500,600,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="kinetic-view">

    <!-- Global Header -->
    <header class="global-header">
        <a href="index.html" class="logo">
            MNTS<span>&mdash;</span>DSGN
            <span class="logo-sub">Architecture &amp; Interior Design</span>
        </a>
        <div class="view-toggle-group" role="group" aria-label="Gallery Display Mode">
            <button type="button" class="view-toggle-btn active" id="btnReelView">Kinetic Reel</button>
            <button type="button" class="view-toggle-btn" id="btnGridView">Grid Gallery</button>
        </div>
        <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="siteNav" aria-label="Open navigation menu">
            <span></span><span></span><span></span>
        </button>
        <nav class="nav" id="siteNav">
            <a href="index.html" class="active">Gallery</a>
            <a href="about.html">About Detail</a>
            <a href="about.html#contact">Contact</a>
            <a href="admin.html" class="badge-admin">Admin CMS</a>
        </nav>
    </header>

    <!-- View 1: Kinetic Horizontal Expanding Panels -->
    <main class="track" id="projectTrack" role="region" aria-label="Architectural Portfolio Reel">
        <!-- Dynamically rendered via js/app.js -->
    </main>

    <!-- View 2: Full Architectural Grid Gallery -->
    <section class="grid-gallery-container" id="gridGalleryContainer" aria-label="Architectural Grid Gallery">
        <div class="grid-gallery-inner">
            <div class="grid-gallery-header">
                <div>
                    <h1>Selected Works</h1>
                    <p>Monolithic structures, spatial compression, and bespoke interior architecture crafted with raw material integrity.</p>
                </div>
            </div>
            <div class="project-grid" id="projectGrid">
                <!-- Dynamically rendered via js/app.js -->
            </div>
        </div>
    </section>

    <!-- Global Footer -->
    <footer class="global-footer">
        <p class="footer__credit">MNTS DSGN &copy; 2026 &bull; Architecture &amp; Interior Design</p>
        <p class="footer__scroll-hint">Hover / Click to Expand Project</p>
    </footer>

    <!-- Native Project Detail Modal (<dialog>) with light-dismiss support -->
    <dialog class="project-dialog" id="projectDialog" closedby="any" aria-label="Architectural Project Details">
        <!-- Dynamically injected via js/app.js -->
    </dialog>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
    <script src="js/supabase.js"></script>
    <script src="js/navigation.js"></script>
    <script src="js/app.js?v=7"></script>
</body>
</html>
